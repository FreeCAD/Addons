################################################################################

name : Validate Index

################################################################################

on:

    pull_request:
        paths : [ 'Data/Index.json' ]

    push:
        paths : [ 'Data/Index.json' ]

    workflow_dispatch:

################################################################################

concurrency:
    cancel-in-progress : true
    group : Validate-Index

################################################################################

jobs:

    Validate:

        runs-on : ubuntu-latest

        steps:

                # https://github.com/marketplace/actions/checkout

            -   name : Checkout Repository
                uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with :

                    submodules : false

                    sparse-checkout: |
                        Data/Index.json

            ####################################################################

                # https://github.com/marketplace/actions/json-schema-validate

            -   name : Validate Format
                uses : dsanders11/json-schema-validate-action@f04ef3bca791388d2bd9ff3a50b27d1b2572158e # v2.1.0
                with :

                    all-errors : true

                    schema : 'https://raw.githubusercontent.com/FreeCAD/AddonManager/dev/AddonCatalog.schema.json'
                    files : 'Data/Index.json'

